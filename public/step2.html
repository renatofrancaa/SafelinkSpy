// Query forwarding helper
function buildForwardUrl(targetUrl, params) {
  var url = new URL(targetUrl, window.location.href);
  var currentParams = new URLSearchParams(window.location.search);
  currentParams.forEach(function(value, key) {
    if (!url.searchParams.has(key)) url.searchParams.set(key, value);
  });
  if (params) {
    Object.keys(params).forEach(function(key) {
      var value = params[key];
      if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, value);
    });
  }
  return url.toString();
}
function navigateWithQuery(targetUrl, params) {
  var url = buildForwardUrl(targetUrl, params);
  // Internal funnel: replace history so Back cannot return to a previous step
  var isExternal = /^https?:\/\//i.test(String(targetUrl || ''));

    window.location.href = url;
  } else {
    window.location.replace(url);
  }
}

// Map country code ISO → index
var isoMap = {};
function rebuildIsoMap() {
  isoMap = {};
  countries.forEach(function(c,i){ isoMap[c.iso] = i; });
}
rebuildIsoMap();

var current = countries[0];

function buildSelect() {
  var sel = document.getElementById('csel');
  sel.innerHTML = '';
  countries.forEach(function(c,i){
    var o = document.createElement('option');
    o.value = i;
    // Flag emoji + country + dial code (shows in native mobile picker)
    o.textContent = (c.flag ? c.flag + ' ' : '') + c.name + ' (' + c.code + ')';
    sel.appendChild(o);
  });
}

function flagUrl(iso) {
  // PNG flag image — works on Windows (emoji flags often show as "BR"/"US" text)
  return 'https://flagcdn.com/w40/' + String(iso || 'us').toLowerCase() + '.png';
}

function renderCountryBtn() {
  var flagEl = document.getElementById('sel-flag');
  flagEl.src = flagUrl(current.iso);
  flagEl.alt = current.iso;
  // Only dial code once: 🇧🇷 image + "+55"
  document.getElementById('sel-code').textContent = current.code;
  document.getElementById('csel').value = String(isoMap[current.iso] !== undefined ? isoMap[current.iso] : 0);
  updateHint();
}

/** Put country first in the list and select it */
function prioritizeCountry(iso) {
  if (!iso) return false;
  iso = String(iso).toUpperCase();
  var idx = isoMap[iso];
  if (idx === undefined) return false;

  if (idx > 0) {
    var item = countries.splice(idx, 1)[0];
    countries.unshift(item);
    rebuildIsoMap();
    buildSelect();
  }

  current = countries[0];
  renderCountryBtn();
  // Never auto-fill the national/DDD field — only DDI on the country chip
  if (typeof clearPhoneIfNotUserTyped === 'function') {
    clearPhoneIfNotUserTyped();
  } else {
    phoneDigits = '';
    var pinp = document.getElementById('phone-inp');
    if (pinp && !pinp.dataset.userTyped) pinp.value = '';
  }
  return true;
}

function setCountry(iso) {
  if (!prioritizeCountry(iso)) {
    // Unknown ISO — keep list order, select first
    current = countries[0];
    renderCountryBtn();
  }
}

function onCountryChange() {
  var idx = parseInt(document.getElementById('csel').value, 10);
  current = countries[idx];
  renderCountryBtn();
  // Changing country resets national/DDD — user must retype intentionally
  phoneDigits = '';
  var inp = document.getElementById('phone-inp');
  if (inp) {
    inp.value = '';
    delete inp.dataset.userTyped;
  }
}

function updateHint() {
  var hints = {
    US:'E.g.: (555) 123-4567',
    CA:'E.g.: (416) 555-1234',
    BR:'E.g.: (11) 99999-9999',
    MX:'E.g.: (55) 1234-5678',
    GB:'E.g.: 7400 123456',
    PT:'E.g.: 912 345 678',
    ES:'E.g.: 612 34 56 78',
    AR:'E.g.: (11) 15-1234-5678',
    DE:'E.g.: 1512 3456789',
    FR:'E.g.: 6 12 34 56 78'
  };
  document.getElementById('hint').textContent = hints[current.iso] || ('E.g.: ' + current.code + ' ...');
}

function hideDetecting() {
  var row = document.getElementById('detecting-row');
  if (row) row.style.display = 'none';
}

function localeCountryGuess() {
  try {
    var lang = (navigator.language || navigator.userLanguage || '').toUpperCase();
    var m = lang.match(/[-_]([A-Z]{2})$/);
    if (m && isoMap[m[1]] !== undefined) return m[1];
    // language-only heuristics
    var map = {PT:'BR', ES:'ES', FR:'FR', DE:'DE', IT:'IT', JA:'JP', KO:'KR', ZH:'CN', HI:'IN', AR:'SA', RU:'RU', NL:'NL', PL:'PL', TR:'TR'};
    var base = lang.split(/[-_]/)[0];
    if (map[base] && isoMap[map[base]] !== undefined) return map[base];
  } catch (e) {}
  return null;
}

function fetchJson(url, timeoutMs) {
  timeoutMs = timeoutMs || 4000;
  return new Promise(function(resolve, reject) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var t = setTimeout(function() {
      if (ctrl) ctrl.abort();
      reject(new Error('timeout'));
    }, timeoutMs);
    fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' })
      .then(function(r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function(d) { clearTimeout(t); resolve(d); })
      .catch(function(e) { clearTimeout(t); reject(e); });
  });
}

// Auto-detect country by IP (several free APIs + fallbacks)
function detectCountry() {
  var sources = [
    // { url, pick(data) → ISO2 }
    { url: 'https://ipapi.co/json/', pick: function(d){ return d && (d.country_code || d.country); } },
    { url: 'https://ipwho.is/', pick: function(d){ return d && d.success !== false && d.country_code; } },
    { url: 'https://api.country.is/', pick: function(d){ return d && d.country; } },
    { url: 'https://get.geojs.io/v1/ip/country.json', pick: function(d){ return d && d.country; } }
  ];

  function tryNext(i) {
    if (i >= sources.length) {
      // Fallbacks when all IP APIs fail
      var guess = localeCountryGuess();
      if (guess) prioritizeCountry(guess);
      else setCountry('US');
      hideDetecting();
      return;
    }
    var src = sources[i];
    fetchJson(src.url, 3500)
      .then(function(d) {
        var iso = src.pick(d);
        if (iso && prioritizeCountry(iso)) {
          hideDetecting();
          return;
        }
        tryNext(i + 1);
      })
      .catch(function(){ tryNext(i + 1); });
  }

  tryNext(0);
}

// Phone field: mask is visual only. Edits always work on digits so delete never sticks on "-".
// National number only — never include country dial code (e.g. BR "55") in this field.
// CRITICAL: never auto-fill DDD/number. Only accept digits the user typed or pasted.
var phoneDigits = '';

function maxPhoneDigits() {
  if (current.iso === 'US' || current.iso === 'CA') return 10;
  if (current.iso === 'BR') return 11;
  return 15;
}

function isUserTypedPhone() {
  var inp = document.getElementById('phone-inp');
  return !!(inp && inp.dataset.userTyped === '1');
}

/** Wipe national field unless the user has already typed/pasted. */
function clearPhoneIfNotUserTyped() {
  if (isUserTypedPhone()) return;
  phoneDigits = '';
  var pinp = document.getElementById('phone-inp');
  if (pinp) pinp.value = '';
}

/**
 * Keep field national-only.
 * Strip leading dial code only for user paste of full international numbers
 * (too long to be a local number) — never strip a real DDD like BR "55" (RS).
 */
function stripDialCode(digits) {
  digits = String(digits || '').replace(/\D/g, '');
  if (!digits) return '';
  var cc = String((current && current.code) || '').replace(/\D/g, '');
  var max = maxPhoneDigits();
  if (!cc) return digits.slice(0, max);

  // Paste of full intl: 5521999887766 (12–13 digits) → drop leading 55
  if (digits.indexOf(cc) === 0 && digits.length > max) {
    digits = digits.slice(cc.length);
  }
  // BR: 55 + 11 national digits
  if (current.iso === 'BR' && digits.length >= 12 && digits.indexOf('55') === 0) {
    digits = digits.slice(2);
  }

  return digits.slice(0, max);
}

function formatPhoneDigits(digits) {
  digits = stripDialCode(digits);
  var max = maxPhoneDigits();
  if (digits.length > max) digits = digits.slice(0, max);

  if (current.iso === 'US' || current.iso === 'CA') {
    if (digits.length === 0) return '';
    if (digits.length <= 3) return '(' + digits;
    if (digits.length <= 6) return '(' + digits.slice(0, 3) + ') ' + digits.slice(3);
    return '(' + digits.slice(0, 3) + ') ' + digits.slice(3, 6) + '-' + digits.slice(6);
  }
  if (current.iso === 'BR') {
    // (XX) XXXXX-XXXX — never leave a trailing hyphen alone
    if (digits.length === 0) return '';
    if (digits.length <= 2) return '(' + digits;
    if (digits.length <= 7) return '(' + digits.slice(0, 2) + ') ' + digits.slice(2);
    return '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 7) + '-' + digits.slice(7);
  }
  return digits;
}

function setPhoneDigits(digits, moveCursorToEnd) {
  // Block programmatic / autofill writes until the user has typed
  if (!isUserTypedPhone() && String(digits || '').replace(/\D/g, '').length > 0) {
    phoneDigits = '';
    var emptyInp = document.getElementById('phone-inp');
    if (emptyInp) emptyInp.value = '';
    return;
  }
  phoneDigits = stripDialCode(String(digits || '').replace(/\D/g, '')).slice(0, maxPhoneDigits());
  var inp = document.getElementById('phone-inp');
  if (!inp) return;
  inp.value = formatPhoneDigits(phoneDigits);
  inp.classList.remove('err');
  var h = document.getElementById('hint');
  if (h) h.classList.remove('err-hint');
  if (moveCursorToEnd !== false) {
    var len = inp.value.length;
    try { inp.setSelectionRange(len, len); } catch (e) {}
  }
}

// legacy name used nowhere after rewrite — keep for safety
function fmtPhone(input) {
  setPhoneDigits(input.value.replace(/\D/g, ''));
}

(function setupPhoneInput() {
  var inp = document.getElementById('phone-inp');
  if (!inp) return;

  // Always start empty — DDI only on the country button; DDD never pre-filled
  phoneDigits = '';
  inp.value = '';
  delete inp.dataset.userTyped;

  // Field starts read-only until the user touches it (blocks silent mobile autofill).
  function unlockInput() {
    inp.removeAttribute('readonly');
    inp.removeEventListener('touchstart', unlockInput);
    inp.removeEventListener('mousedown', unlockInput);
  }
  inp.addEventListener('touchstart', unlockInput, { passive: true });
  inp.addEventListener('mousedown', unlockInput);

  inp.addEventListener('focus', function () {
    unlockInput();
    // Autofill often fires on focus — reject anything the user did not type
    if (!isUserTypedPhone()) {
      phoneDigits = '';
      inp.value = '';
    }
  });

  // Count how many digits sit before caret in the masked string
  function digitsBeforeCaret(val, caret) {
    return val.slice(0, caret).replace(/\D/g, '').length;
  }

  function applyDigitsKeepingCaret(newDigits, digitCaret) {
    phoneDigits = stripDialCode(newDigits).slice(0, maxPhoneDigits());
    var formatted = formatPhoneDigits(phoneDigits);
    inp.value = formatted;
    // Place caret after the Nth digit in the formatted string
    var seen = 0;
    var pos = formatted.length;
    for (var i = 0; i < formatted.length; i++) {
      if (/\d/.test(formatted.charAt(i))) {
        seen++;
        if (seen >= digitCaret) {
          pos = i + 1;
          break;
        }
      }
    }
    if (digitCaret <= 0) pos = 0;
    try { inp.setSelectionRange(pos, pos); } catch (e) {}
    inp.classList.remove('err');
    var h = document.getElementById('hint');
    if (h) h.classList.remove('err-hint');
  }

  // Mobile + desktop: intercept delete/insert before the value changes
  inp.addEventListener('beforeinput', function (e) {
    var type = e.inputType || '';
    var start = inp.selectionStart || 0;
    var end = inp.selectionEnd || 0;
    var val = inp.value;
    var digs = phoneDigits || val.replace(/\D/g, '');
    var digStart = digitsBeforeCaret(val, start);
    var digEnd = digitsBeforeCaret(val, end);

    // DELETE (backspace / forward delete / mobile clear)
    if (
      type === 'deleteContentBackward' ||
      type === 'deleteContentForward' ||
      type === 'deleteByCut' ||
      type === 'deleteByDrag' ||
      type === 'deleteContent'
    ) {
      e.preventDefault();
      if (digStart !== digEnd) {
        var next = digs.slice(0, digStart) + digs.slice(digEnd);
        applyDigitsKeepingCaret(next, digStart);
        return;
      }
      if (type === 'deleteContentForward') {
        if (digStart < digs.length) {
          applyDigitsKeepingCaret(digs.slice(0, digStart) + digs.slice(digStart + 1), digStart);
        }
        return;
      }
      if (digStart > 0) {
        applyDigitsKeepingCaret(digs.slice(0, digStart - 1) + digs.slice(digStart), digStart - 1);
      } else if (digs.length) {
        applyDigitsKeepingCaret(digs.slice(0, -1), digs.length - 1);
      } else {
        phoneDigits = '';
        inp.value = '';
      }
      return;
    }

    // INSERT digits (typing / paste) — only these mark userTyped
    if (type === 'insertText' || type === 'insertFromPaste' || type === 'insertCompositionText') {
      var raw = (e.data != null ? e.data : '');
      var only = String(raw).replace(/\D/g, '');
      if (!only && type !== 'insertFromPaste') {
        e.preventDefault();
        return;
      }
      e.preventDefault();
      if (type === 'insertFromPaste' && !only) {
        only = String(raw).replace(/\D/g, '');
      }
      if (!only) return;
      inp.dataset.userTyped = '1';
      var nextIns = digs.slice(0, digStart) + only + digs.slice(digEnd);
      nextIns = stripDialCode(nextIns).slice(0, maxPhoneDigits());
      applyDigitsKeepingCaret(nextIns, Math.min(nextIns.length, digStart + only.length));
      return;
    }

    // insertReplacementText / insertFromDrop / insertFromYank = often autofill
    if (
      type === 'insertReplacementText' ||
      type === 'insertFromDrop' ||
      type === 'insertFromYank' ||
      type === 'historyUndo' ||
      type === 'historyRedo'
    ) {
      if (!isUserTypedPhone()) {
        e.preventDefault();
        phoneDigits = '';
        inp.value = '';
      }
    }
  });

  // Fallback for browsers without beforeinput
  inp.addEventListener('keydown', function (e) {
    // Digit key → mark as user-typed (needed when beforeinput missing)
    if (/^\d$/.test(e.key)) {
      inp.dataset.userTyped = '1';
    }
    if (e.key !== 'Backspace' && e.key !== 'Delete') return;
    if (typeof InputEvent !== 'undefined' && 'inputType' in InputEvent.prototype) {
      return;
    }
    e.preventDefault();
    var digs = phoneDigits || inp.value.replace(/\D/g, '');
    if (!digs.length) {
      phoneDigits = '';
      inp.value = '';
      return;
    }
    if (e.key === 'Backspace') setPhoneDigits(digs.slice(0, -1));
    else setPhoneDigits(digs.slice(0, -1));
  });

  // Fallback / autofill / mobile keyboards that skip beforeinput
  inp.addEventListener('input', function () {
    // HARD RULE: until the user types, never keep digits (kills autofill DDD)
    if (!isUserTypedPhone()) {
      phoneDigits = '';
      if (inp.value) inp.value = '';
      return;
    }
    var digs = inp.value.replace(/\D/g, '');
    var expected = formatPhoneDigits(phoneDigits);

    if (digs === phoneDigits) {
      if (inp.value.length < expected.length && phoneDigits.length > 0) {
        setPhoneDigits(phoneDigits.slice(0, -1));
      } else {
        setPhoneDigits(phoneDigits);
      }
      return;
    }

    setPhoneDigits(digs);
  });

  // Autocomplete events (Chrome/Safari mobile)
  inp.addEventListener('change', function () {
    if (!isUserTypedPhone()) clearPhoneIfNotUserTyped();
  });
  inp.addEventListener('blur', function () {
    if (!isUserTypedPhone()) clearPhoneIfNotUserTyped();
  });

  // Safety net: keep wiping silent autofill for a few seconds after load
  var guardUntil = Date.now() + 5000;
  var guard = setInterval(function () {
    if (Date.now() > guardUntil) {
      clearInterval(guard);
      return;
    }
    clearPhoneIfNotUserTyped();
  }, 200);
})();

function startSpy() {
  var raw = document.getElementById('phone-inp').value.replace(/\D/g,'');
  if (raw.length < 5) {
    document.getElementById('phone-inp').classList.add('err');
    var h = document.getElementById('hint');
    h.textContent = '⚠ Enter a valid phone number';
    h.classList.add('err-hint');
    return;
  }
  var full = current.code + ' ' + document.getElementById('phone-inp').value;
  sessionStorage.setItem('sl_phone', full);

  // Keep gender from step 1
  var g = new URLSearchParams(window.location.search).get('gender') || sessionStorage.getItem('sl_gender') || '';
  if (g) {
    try { sessionStorage.setItem('sl_gender', g); } catch (e) {}
  }

  // Prefetch WhatsApp profile photo (Auralink API) while connecting
  var dig = (current.code + raw).replace(/\D/g, '');
  try {
    if (window.ProfilePhoto) ProfilePhoto.prefetch(dig);
  } catch (e) {}

  var btn = document.getElementById('spy-btn');
  btn.innerHTML = '<div style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;"></div> Connecting...';
  btn.disabled = true;

  setTimeout(function(){
    var params = { phone: full };
    if (g) params.gender = g;
    navigateWithQuery('step3.html', params);
  }, 1200);
}

// Persist gender if arriving from step 1
(function(){
  var g = new URLSearchParams(window.location.search).get('gender');
  if (g) {
    try { sessionStorage.setItem('sl_gender', g); } catch (e) {}
  }
})();

buildSelect();
renderCountryBtn(); // temporary default until IP resolves
detectCountry();
</script>
