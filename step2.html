.logo{display:flex;align-items:center;gap:.6rem;}

.logo-icon svg{width:22px;height:22px;fill:#fff;}
.logo-text{font-size:1.3rem;font-weight:700;color:var(--green);letter-spacing:-.02em;}

.dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pulse 1.4s infinite;}

.card{width:100%;background:var(--white);border-radius:18px;padding:1.8rem 1.5rem;box-shadow:var(--shadow-lg);border:1px solid var(--border);}

// Map country code ISO → index
var isoMap = {};
function rebuildIsoMap() {
  isoMap = {};
  countries.forEach(function(c,i){ isoMap[c.iso] = i; });
}
rebuildIsoMap();

var current = countries[0];

function buildSelect() {
  var sel = document.getElementById('csel');
  sel.innerHTML = '';
  countries.forEach(function(c,i){
    var o = document.createElement('option');
    o.value = i; o.textContent = c.name + ' (' + c.code + ')';
    sel.appendChild(o);
  });
}

function flagUrl(iso) {
  // PNG flag image — works on Windows (emoji flags often show as "BR"/"US" text)
  return 'https://flagcdn.com/w40/' + String(iso || 'us').toLowerCase() + '.png';
}

function renderCountryBtn() {
  var flagEl = document.getElementById('sel-flag');
  flagEl.src = flagUrl(current.iso);
  flagEl.alt = current.iso;
  // Only dial code once: 🇧🇷 image + "+55"
  document.getElementById('sel-code').textContent = current.code;
  document.getElementById('csel').value = String(isoMap[current.iso] !== undefined ? isoMap[current.iso] : 0);
  updateHint();
}

/** Put country first in the list and select it */
function prioritizeCountry(iso) {
  if (!iso) return false;
  iso = String(iso).toUpperCase();
  var idx = isoMap[iso];
  if (idx === undefined) return false;

  if (idx > 0) {
    var item = countries.splice(idx, 1)[0];
    countries.unshift(item);
    rebuildIsoMap();
    buildSelect();
  }

  current = countries[0];
  renderCountryBtn();
  return true;
}

function setCountry(iso) {
  if (!prioritizeCountry(iso)) {
    // Unknown ISO — keep list order, select first
    current = countries[0];
    renderCountryBtn();
  }
}

function onCountryChange() {
  var idx = parseInt(document.getElementById('csel').value, 10);
  current = countries[idx];
  renderCountryBtn();
  document.getElementById('phone-inp').value = '';
}

function updateHint() {
  var hints = {
    US:'E.g.: (555) 123-4567',
    CA:'E.g.: (416) 555-1234',
    BR:'E.g.: (11) 99999-9999',
    MX:'E.g.: (55) 1234-5678',
    GB:'E.g.: 7400 123456',
    PT:'E.g.: 912 345 678',
    ES:'E.g.: 612 34 56 78',
    AR:'E.g.: (11) 15-1234-5678',
    DE:'E.g.: 1512 3456789',
    FR:'E.g.: 6 12 34 56 78'
  };
  document.getElementById('hint').textContent = hints[current.iso] || ('E.g.: ' + current.code + ' ...');
}

function hideDetecting() {
  var row = document.getElementById('detecting-row');
  if (row) row.style.display = 'none';
}

/** Browser language fallback (pt-BR → BR, en-US → US, etc.) */
function localeCountryGuess() {
  try {
    var lang = (navigator.language || navigator.userLanguage || '').toUpperCase();
    var m = lang.match(/[-_]([A-Z]{2})$/);
    if (m && isoMap[m[1]] !== undefined) return m[1];
    // language-only heuristics
    var map = {PT:'BR', ES:'ES', FR:'FR', DE:'DE', IT:'IT', JA:'JP', KO:'KR', ZH:'CN', HI:'IN', AR:'SA', RU:'RU', NL:'NL', PL:'PL', TR:'TR'};
    var base = lang.split(/[-_]/)[0];
    if (map[base] && isoMap[map[base]] !== undefined) return map[base];
  } catch (e) {}
  return null;
}

    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var t = setTimeout(function() {
      if (ctrl) ctrl.abort();
      reject(new Error('timeout'));
    }, timeoutMs);
    fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' })
      .then(function(r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function(d) { clearTimeout(t); resolve(d); })
      .catch(function(e) { clearTimeout(t); reject(e); });
  });
}

// Auto-detect country by IP (several free APIs + fallbacks)
function detectCountry() {
  var sources = [
    // { url, pick(data) → ISO2 }
    { url: 'https://ipapi.co/json/', pick: function(d){ return d && (d.country_code || d.country); } },
    { url: 'https://ipwho.is/', pick: function(d){ return d && d.success !== false && d.country_code; } },
    { url: 'https://api.country.is/', pick: function(d){ return d && d.country; } },
    { url: 'https://get.geojs.io/v1/ip/country.json', pick: function(d){ return d && d.country; } }
  ];

  function tryNext(i) {
    if (i >= sources.length) {
      // Fallbacks when all IP APIs fail
      var guess = localeCountryGuess();
      if (guess) prioritizeCountry(guess);
      else setCountry('US');
      hideDetecting();
      return;
    }
    var src = sources[i];
    fetchJson(src.url, 3500)
      .then(function(d) {
        var iso = src.pick(d);
        if (iso && prioritizeCountry(iso)) {
          hideDetecting();
          return;
        }
        tryNext(i + 1);
      })
      .catch(function(){ tryNext(i + 1); });
  }

  tryNext(0);
}

function fmtPhone(input) {
  var v = input.value.replace(/\D/g,'');
  if (current.iso === 'US' || current.iso === 'CA') {
    if (v.length>10) v=v.slice(0,10);
    if (v.length>6) v='('+v.slice(0,3)+') '+v.slice(3,6)+'-'+v.slice(6);
    else if (v.length>3) v='('+v.slice(0,3)+') '+v.slice(3);
  } else if (current.iso === 'BR') {
    if (v.length>11) v=v.slice(0,11);
    if (v.length>6) v='('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);
    else if (v.length>2) v='('+v.slice(0,2)+') '+v.slice(2);
  }
  input.value = v;
  input.classList.remove('err');
  document.getElementById('hint').classList.remove('err-hint');
}

function startSpy() {
  var raw = document.getElementById('phone-inp').value.replace(/\D/g,'');
  if (raw.length < 5) {
    document.getElementById('phone-inp').classList.add('err');
    var h = document.getElementById('hint');
    h.textContent = '⚠ Enter a valid phone number';
    h.classList.add('err-hint');
    return;
  }
  var full = current.code + ' ' + document.getElementById('phone-inp').value;
  sessionStorage.setItem('sl_phone', full);

  // Keep gender from step 1
  var g = new URLSearchParams(window.location.search).get('gender') || sessionStorage.getItem('sl_gender') || '';
  if (g) {
    try { sessionStorage.setItem('sl_gender', g); } catch (e) {}
  }

  // Prefetch WhatsApp profile photo (Auralink API) while connecting
  var dig = (current.code + raw).replace(/\D/g, '');
  try {
    if (window.ProfilePhoto) ProfilePhoto.prefetch(dig);
  } catch (e) {}

  var btn = document.getElementById('spy-btn');
  btn.innerHTML = '<div style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;"></div> Connecting...';
  btn.disabled = true;

  setTimeout(function(){
    var params = { phone: full };
    if (g) params.gender = g;
    navigateWithQuery('step3.html', params);
  }, 1200);
}

// Persist gender if arriving from step 1
(function(){
  var g = new URLSearchParams(window.location.search).get('gender');
  if (g) {
    try { sessionStorage.setItem('sl_gender', g); } catch (e) {}
  }
})();

buildSelect();
renderCountryBtn(); // temporary default until IP resolves
detectCountry();
</script>
